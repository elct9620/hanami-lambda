# Please keep AllCops, Bundler, Style, Metrics groups and then order cops
# alphabetically
inherit_from:
  - https://raw.githubusercontent.com/hanami/devtools/main/.rubocop.yml

AllCops:
  TargetRubyVersion: 3.3
  # CI installs gems into vendor/bundle; without this, RuboCop 1.88 loads
  # the rbs gem's bundled config and fails on its rubocop-rubycw plugin.
  Exclude:
    - "vendor/**/*"

Layout/LineLength:
  Exclude:
    - Gemfile
